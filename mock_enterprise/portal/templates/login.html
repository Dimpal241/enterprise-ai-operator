<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CentrAlign Enterprise Portal - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 36px 40px;
      width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .logo-badge {
      background: #238636;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #f0f6fc;
    }
    p.subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-top: 4px;
    }
    .form-group {
      margin-top: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #c9d1d9;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 14px;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #58a6ff;
    }
    button {
      width: 100%;
      margin-top: 26px;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2ea043;
    }
    .error-msg {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: #f85149;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 16px;
    }
    .hint {
      margin-top: 20px;
      font-size: 12px;
      color: #6e7681;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <h1>CentrAlign ERP</h1>
      <span class="logo-badge">ENTERPRISE</span>
    </div>
    <p class="subtitle">Internal Accounts Payable & Invoice Gateway</p>

    {% if error %}
    <div class="error-msg" id="error-message">Invalid username or password. Please try again.</div>
    {% endif %}

    <form action="/login" method="post">
      <div class="form-group">
        <label for="username">Operator / Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. agent" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="login-btn">Sign In to ERP Portal</button>
    </form>

    <div class="hint">
      Authorized agent credentials: <code>agent</code> / <code>company123</code>
    </div>
  </div>
</body>
</html>
